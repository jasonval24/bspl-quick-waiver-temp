<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Quick Waiver | Blue Shore Pedal Lounge</title>
  <link rel="icon" type="image/jpeg" href="https://vibe.filesafe.space/1783714483366437915/attachments/2edc7451-3df5-4191-be38-125e33f66b74.jpg" />
  <style>
    :root {
      --bg: #0b1220;
      --card: #141e33;
      --ink: #f4f7ff;
      --muted: #a9b6d3;
      --accent: #3dd6c6;
      --border: rgba(255,255,255,0.08);
      --success: #3ddc97;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(61,214,198,0.18), transparent 55%),
        radial-gradient(900px 500px at 110% 10%, rgba(61,220,151,0.12), transparent 50%),
        var(--bg);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 40px;
    }
    .wrap { width: 100%; max-width: 440px; }
    .logo {
      display: block;
      width: 88px; height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(61,214,198,0.55);
      background: #fff;
      margin: 0 auto 16px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.35);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(61,214,198,0.12);
      border: 1px solid rgba(61,214,198,0.35);
      border-radius: 999px;
      padding: 6px 12px;
      margin-bottom: 14px;
    }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent 40%), var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px 22px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 6vw, 2rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }
    .sub {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.45;
    }
    form { text-align: left; }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0 0 6px;
    }
    input[type="text"], input[type="tel"] {
      width: 100%;
      appearance: none;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.28);
      color: var(--ink);
      border-radius: 14px;
      padding: 14px 14px;
      font-size: 1.05rem;
      margin-bottom: 14px;
      outline: none;
    }
    input:focus {
      border-color: rgba(61,214,198,0.7);
      box-shadow: 0 0 0 3px rgba(61,214,198,0.18);
    }
    .agree {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin: 4px 0 16px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.4;
    }
    .agree input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; }
    .agree a { color: var(--accent); }
    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px 16px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      color: #041018;
      background: linear-gradient(135deg, var(--accent), #7cf0c4 60%, #b8ffe0);
      margin-top: 4px;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.6; cursor: wait; }
    .msg {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      text-align: left;
    }
    .msg.error { display: block; background: rgba(255,107,157,0.12); border: 1px solid rgba(255,107,157,0.35); color: #ffd0e0; }
    .fine {
      margin: 16px 0 0;
      font-size: 0.78rem;
      color: #7f8eae;
      line-height: 1.4;
      text-align: center;
    }
    .success-panel { display: none; padding: 8px 4px 4px; }
    .success-panel.show { display: block; }
    .form-panel.hide { display: none; }
    .check {
      width: 120px; height: 120px;
      margin: 8px auto 18px;
      border-radius: 50%;
      border: 4px solid var(--success);
      display: flex; align-items: center; justify-content: center;
      color: var(--success);
      box-shadow: 0 0 0 8px rgba(61,220,151,0.12);
    }
    .check svg { width: 64px; height: 64px; }
    .success-panel h2 { margin: 0 0 8px; font-size: 1.45rem; }
    .success-panel p { color: var(--muted); margin: 0; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <img class="logo" src="https://vibe.filesafe.space/1783714483366437915/attachments/2edc7451-3df5-4191-be38-125e33f66b74.jpg" alt="Blue Shore Pedal Lounge" />
      <span class="badge">Blue Shore Pedal Lounge</span>

      <div id="formPanel" class="form-panel">
        <h1>Quick Waiver</h1>
        <p class="sub">Enter your name and mobile, then agree to the terms to acknowledge the ride waiver.</p>
        <form id="waiverForm" novalidate>
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" autocomplete="name" placeholder="Your full name" required />

          <label for="phone">Mobile number</label>
          <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(xxx) xxx-xxxx" required />

          <label class="agree">
            <input id="agree" type="checkbox" required />
            <span>I agree to the <a href="https://bluepedallounge.com/terms" target="_blank" rel="noopener">Terms</a> and acknowledge the Blue Shore Pedal Lounge ride waiver.</span>
          </label>

          <button type="submit" id="submitBtn">Submit acknowledgement</button>
          <div id="err" class="msg" role="alert"></div>
          <p class="fine">Temporary QR page for walk-up riders. Full legal form for booked tours: bluepedallounge.com/sign-waiver</p>
        </form>
      </div>

      <div id="success" class="success-panel" aria-live="polite">
        <div class="check" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <h2>Waiver Acknowledged</h2>
        <p>You're set — show staff this screen if asked.</p>
      </div>
    </div>
  </main>
  <script>
    (function () {
      // Primary: dedicated Make webhook (upsert contact + tag waiver-ack; does NOT hit Job Application Intake).
      // Fallback constant kept for docs only — do not point QR traffic at shared job webhook.
      var MAKE_WEBHOOK = "https://hook.us2.make.com/5l6m1vdlknibiismj8kgs0mbwm3t3f1b";
      var SHARED_JOB_WEBHOOK = "https://services.leadconnectorhq.com/hooks/SR6TyBbdGg6FF6mVEJX4/webhook-trigger/gfSuSDSxNT9oko3KySWR";
      var USE_SHARED_FALLBACK = false; // flipped true only if Make hook unavailable at publish time
      var WEBHOOK = MAKE_WEBHOOK;
      var LOC = "SR6TyBbdGg6FF6mVEJX4";
      var ACK_VERSION = "board-ack-v1-temp";

      var formPanel = document.getElementById("formPanel");
      var success = document.getElementById("success");
      var form = document.getElementById("waiverForm");
      var submitBtn = document.getElementById("submitBtn");
      var err = document.getElementById("err");
      var fullNameEl = document.getElementById("fullName");
      var phoneEl = document.getElementById("phone");
      var agreeEl = document.getElementById("agree");

      function digitsOnly(s) { return String(s || "").replace(/\D/g, ""); }

      function normalizePhone(raw) {
        var d = digitsOnly(raw);
        if (!d) return "";
        if (d.length === 10) return "+1" + d;
        if (d.length === 11 && d.charAt(0) === "1") return "+" + d;
        if (String(raw).trim().charAt(0) === "+" && d.length >= 10) return "+" + d;
        if (d.length >= 10) return (d.length === 10 ? "+1" : "+") + (d.length === 11 && d.charAt(0) === "1" ? d : d);
        return "";
      }

      function isCompletePhone(raw) {
        return digitsOnly(raw).length >= 10;
      }

      function prefillPhoneFromQuery() {
        var params = new URLSearchParams(window.location.search);
        var keys = ["phone", "mobile", "Phone", "contact.phone"];
        for (var i = 0; i < keys.length; i++) {
          var v = params.get(keys[i]);
          if (v && isCompletePhone(v)) {
            phoneEl.value = v.trim();
            return;
          }
        }
        // Truncated stubs like ?phone=(361 are ignored on purpose.
      }

      function splitName(name) {
        var parts = String(name || "").trim().split(/\s+/);
        return { firstName: parts[0] || "", lastName: parts.slice(1).join(" ") };
      }

      function showError(msg) {
        err.className = "msg error";
        err.textContent = msg;
      }
      function clearError() {
        err.className = "msg";
        err.textContent = "";
      }

      prefillPhoneFromQuery();

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        clearError();
        var name = fullNameEl.value.trim();
        var phoneRaw = phoneEl.value.trim();
        if (!name) { showError("Please enter your full name."); return; }
        if (!isCompletePhone(phoneRaw)) { showError("Please enter a complete mobile number (10+ digits)."); return; }
        if (!agreeEl.checked) { showError("Please agree to the Terms to continue."); return; }

        var phone = normalizePhone(phoneRaw);
        var parts = splitName(name);
        var now = new Date().toISOString();
        var sid = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());

        var payload = {
          name: name,
          firstName: parts.firstName,
          lastName: parts.lastName,
          phone: phone,
          tag: "waiver-ack",
          tags: ["waiver-ack"],
          form: "Quick Waiver Ack",
          formName: "Quick Waiver Ack",
          formId: "waiver-ack",
          waiver_ack_at: now,
          waiver_ack_version: ACK_VERSION,
          waiver_ack_source: "temp-qr-page",
          waiver_ack_page: window.location.href,
          submittedAt: now,
          source: "temp-quick-waiver",
          ghlSubmissionId: sid,
          ghlLocationId: LOC
        };

        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting…";
        try {
          var target = USE_SHARED_FALLBACK ? SHARED_JOB_WEBHOOK : WEBHOOK;
          await fetch(target, {
            method: "POST",
            mode: "cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
        } catch (ex) {
          console.warn("Waiver submit:", ex);
          // Still show success so riders aren't blocked if CORS/network flakes; payload may still arrive.
        }
        formPanel.classList.add("hide");
        success.classList.add("show");
      });
    })();
  </script>
</body>
</html>
